<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<title>帯変換ツール</title>
<style>
*{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent}
html,body{height:100%;overflow:hidden;width:100%}
body{font-family:-apple-system,BlinkMacSystemFont,"Hiragino Sans",sans-serif;background:#f5f5f7;color:#1a1a2e;font-size:13px}
.app{display:flex;flex-direction:column;height:var(--app-h,100vh);overflow:hidden}
.hdr{padding:10px 16px;padding-top:calc(10px + env(safe-area-inset-top,0px));background:#1a1a2e;color:#fff;display:flex;align-items:center;justify-content:space-between;flex-shrink:0;z-index:10}
.hdr h1{font-size:15px;font-weight:700}
.hdr .status{font-size:10px;color:#8e93b8;max-width:120px;text-align:right;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.main{flex:1;overflow:hidden;display:flex;flex-direction:column;min-height:0}
.welcome{flex:1;display:flex;flex-direction:column;align-items:center;justify-content:center;padding:24px;text-align:center}
.welcome .icon{font-size:48px;margin-bottom:12px}
.welcome h2{font-size:18px;font-weight:700;color:#1a1a2e;margin-bottom:6px}
.welcome p{font-size:12px;color:#888;margin-bottom:20px;line-height:1.5}
.btn-select{display:inline-flex;align-items:center;gap:8px;padding:14px 28px;background:#4361ee;color:#fff;border:none;border-radius:12px;font-size:15px;font-weight:700;cursor:pointer;position:relative}
.btn-select input{position:absolute;inset:0;opacity:0;cursor:pointer;width:100%;height:100%}
.preview-area{flex:1;overflow:auto;background:#e8e8e8;display:none;-webkit-overflow-scrolling:touch;min-height:0}
.preview-stage{position:relative;width:100%;line-height:0;font-size:0}
.preview-stage img{display:block;width:100%}
.cut-line{position:absolute;left:0;right:0;height:4px;background:#e63946;z-index:3;transform:translateY(-50%);touch-action:none;cursor:ns-resize}
.cut-line::after{content:"⇕";position:absolute;right:8px;top:50%;transform:translateY(-50%);background:#e63946;color:#fff;width:32px;height:32px;border-radius:50%;display:flex;align-items:center;justify-content:center;font-size:16px;font-weight:700}
.cut-label{position:absolute;left:8px;top:50%;transform:translateY(-50%);background:#e63946;color:#fff;padding:4px 12px;border-radius:8px;font-size:13px;font-weight:700;white-space:nowrap;line-height:1.4}
.zone-overlay{position:absolute;left:0;right:0;bottom:0;background:rgba(230,57,70,0.2);z-index:2;pointer-events:none;display:flex;align-items:center;justify-content:center;font-size:12px;font-weight:700;color:rgba(230,57,70,0.5)}
.bottom-bar{padding:10px 16px;padding-bottom:calc(10px + env(safe-area-inset-bottom,0px));background:#fff;border-top:1px solid #e6e7ea;display:flex;gap:8px;align-items:center;flex-shrink:0;z-index:10}
.btn-bottom{flex:1;padding:11px 8px;background:#f0f2f5;color:#555;border:none;border-radius:10px;font-size:12px;font-weight:600;cursor:pointer;position:relative;text-align:center}
.btn-bottom input{position:absolute;inset:0;opacity:0;cursor:pointer;width:100%;height:100%}
.btn-export{flex:2;padding:11px 8px;background:#2ec47a;color:#fff;border:none;border-radius:10px;font-size:14px;font-weight:700;cursor:pointer}
.btn-export:disabled{opacity:0.4;cursor:not-allowed}
.btn-export:active:not(:disabled){background:#28a564}
.loading{display:none;position:fixed;inset:0;background:rgba(0,0,0,0.5);z-index:100;align-items:center;justify-content:center}
.loading.show{display:flex}
.loading-box{background:#fff;border-radius:16px;padding:28px 36px;text-align:center}
.loading-box .spinner{width:36px;height:36px;border:3px solid #eee;border-top-color:#4361ee;border-radius:50%;animation:spin 0.8s linear infinite;margin:0 auto 12px}
@keyframes spin{to{transform:rotate(360deg)}}
.loading-box p{font-size:13px;color:#555}
.toast{position:fixed;bottom:80px;left:50%;transform:translateX(-50%);background:#1a1a2e;color:#fff;padding:10px 20px;border-radius:10px;font-size:12px;font-weight:600;z-index:50;opacity:0;transition:opacity 0.3s;pointer-events:none;max-width:85%;text-align:center}
.toast.show{opacity:1}
</style>
</head>
<body>
<div class="app" id="app">
  <div class="hdr">
    <h1>帯変換ツール</h1>
    <span class="status" id="statusText">画像を選択してください</span>
  </div>
  <div class="main">
    <div class="welcome" id="welcomeScreen">
      <div class="icon">🖼️</div>
      <h2>マイソクの帯を変換</h2>
      <p>マイソク画像の帯を自社帯に差し替えます</p>
      <label class="btn-select">
        📂 画像を選択
        <input type="file" accept="image/*" onchange="loadImage(this)">
      </label>
    </div>
    <div class="preview-area" id="previewArea">
      <div class="preview-stage" id="previewStage">
        <img id="srcImage" draggable="false">
        <div class="zone-overlay" id="zoneOverlay">✕ 切り取り</div>
        <div class="cut-line" id="cutLine">
          <div class="cut-label" id="cutLabel">85.0%</div>
        </div>
      </div>
    </div>
  </div>
  <div class="bottom-bar">
    <label class="btn-bottom">
      🎨 帯変更
      <input type="file" accept="image/*" onchange="changeObi(this)">
    </label>
    <label class="btn-bottom">
      🖼️ 別の画像
      <input type="file" accept="image/*" onchange="loadImage(this)">
    </label>
    <button class="btn-export" id="exportBtn" onclick="exportImage()" disabled>🖨 保存</button>
  </div>
</div>
<div class="loading" id="loadingOverlay">
  <div class="loading-box"><div class="spinner"></div><p id="loadingText">処理中...</p></div>
</div>
<div class="toast" id="toast"></div>

<script>
const DEFAULT_OBI=null;
let cutRatio=0.85,isDragging=false,srcLoaded=false;

const obiImg=new Image();
let obiSrc=localStorage.getItem("customObi")||null;
let obiReady=false;
if(obiSrc){obiImg.src=obiSrc;obiReady=true}

function setAppHeight(){document.documentElement.style.setProperty("--app-h",window.innerHeight+"px")}
setAppHeight();
window.addEventListener("resize",setAppHeight);
window.addEventListener("orientationchange",()=>setTimeout(setAppHeight,100));

// 帯変更
function changeObi(input){
  const file=input.files[0];if(!file)return;input.value="";
  const reader=new FileReader();
  reader.onload=e=>{
    obiSrc=e.target.result;obiImg.src=obiSrc;obiReady=true;
    try{localStorage.setItem("customObi",obiSrc)}catch(err){}
    showToast("✓ 帯画像を設定しました");
    if(srcLoaded)document.getElementById("exportBtn").disabled=false;
  };
  reader.readAsDataURL(file);
}

// 画像読み込み
function loadImage(input){
  const file=input.files[0];if(!file)return;input.value="";
  showLoading("読み込み中...");
  const reader=new FileReader();
  reader.onload=e=>{
    const img=document.getElementById("srcImage");
    img.onload=()=>{
      srcLoaded=true;cutRatio=0.85;updateCutUI();
      document.getElementById("welcomeScreen").style.display="none";
      document.getElementById("previewArea").style.display="block";
      document.getElementById("exportBtn").disabled=!obiReady;
      document.getElementById("statusText").textContent=file.name;
      hideLoading();
      if(!obiReady)showToast("帯画像を設定してください（🎨 帯変更ボタン）");
      else showToast("赤いバーをドラッグして切り取り位置を調整");
    };
    img.src=e.target.result;
  };
  reader.readAsDataURL(file);
}

function updateCutUI(){
  document.getElementById("cutLine").style.top=(cutRatio*100)+"%";
  const ov=document.getElementById("zoneOverlay");
  ov.style.top=(cutRatio*100)+"%";ov.style.height=((1-cutRatio)*100)+"%";
  document.getElementById("cutLabel").textContent=(cutRatio*100).toFixed(1)+"%";
}

// ドラッグ
function getY(e){return e.touches?e.touches[0].clientY:e.clientY}
const cutLine=document.getElementById("cutLine");
cutLine.addEventListener("mousedown",e=>{e.preventDefault();isDragging=true});
cutLine.addEventListener("touchstart",e=>{e.preventDefault();isDragging=true},{passive:false});
document.addEventListener("mousemove",onMove);
document.addEventListener("touchmove",onMove,{passive:false});
document.addEventListener("mouseup",()=>{isDragging=false});
document.addEventListener("touchend",()=>{isDragging=false});

function onMove(e){
  if(!isDragging)return;e.preventDefault();
  const img=document.getElementById("srcImage");
  const rect=img.getBoundingClientRect();
  let ratio=(getY(e)-rect.top)/rect.height;
  cutRatio=Math.max(0.3,Math.min(0.98,ratio));
  updateCutUI();
}

// 出力
function exportImage(){
  if(!srcLoaded||!obiReady)return;
  showLoading("画像を生成中...");
  setTimeout(()=>{
    try{
      const img=document.getElementById("srcImage");
      const c=document.createElement("canvas");
      c.width=img.naturalWidth;c.height=img.naturalHeight;
      c.getContext("2d").drawImage(img,0,0);
      const cutY=Math.round(c.height*cutRatio);
      const obiAspect=obiImg.naturalWidth/obiImg.naturalHeight;
      const obiH=Math.round(c.width/obiAspect);
      const out=document.createElement("canvas");
      out.width=c.width;out.height=cutY+obiH;
      const ctx=out.getContext("2d");
      ctx.drawImage(c,0,0,c.width,cutY,0,0,c.width,cutY);
      ctx.drawImage(obiImg,0,cutY,c.width,obiH);

      const now=new Date();
      const ts=now.getFullYear()+""+(""+(now.getMonth()+1)).padStart(2,"0")+(""+ now.getDate()).padStart(2,"0")+"_"+(""+ now.getHours()).padStart(2,"0")+(""+ now.getMinutes()).padStart(2,"0")+(""+ now.getSeconds()).padStart(2,"0");
      const fn=ts+".jpg";

      out.toBlob(blob=>{
        const url=URL.createObjectURL(blob);
        if(/iPhone|iPad|iPod/i.test(navigator.userAgent)){
          window.open(url,"_blank");
          hideLoading();showToast("画像が表示されました。長押しで保存してください");
        }else{
          const a=document.createElement("a");a.href=url;a.download=fn;a.click();
          hideLoading();showToast("✓ 保存しました");
        }
        setTimeout(()=>URL.revokeObjectURL(url),30000);
      },"image/jpeg",0.92);
    }catch(e){hideLoading();showToast("エラーが発生しました");console.error(e)}
  },50);
}

function showLoading(t){document.getElementById("loadingText").textContent=t;document.getElementById("loadingOverlay").classList.add("show")}
function hideLoading(){document.getElementById("loadingOverlay").classList.remove("show")}
function showToast(msg){const t=document.getElementById("toast");t.textContent=msg;t.classList.add("show");setTimeout(()=>t.classList.remove("show"),3000)}
</script>
</body>
</html>
